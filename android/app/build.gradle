apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// 手机正式签名只从本机配置读取，密钥不进入源码仓库。
def phoneSigningFile = rootProject.file(project.findProperty('PHONE_SIGNING_PROPERTIES') ?: 'phone-signing.properties')
def phoneSigning = new Properties()
if (phoneSigningFile.exists()) {
    phoneSigningFile.withInputStream { phoneSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!phoneSigning.getProperty(key)) throw new GradleException("手机签名配置缺少 ${key}")
    }
}

android {
    namespace = "com.flipbook.ai"
    compileSdk = rootProject.ext.compileSdkVersion

    def apiBaseUrlProp = project.findProperty("API_BASE_URL") ?: System.getenv("API_BASE_URL") ?: "https://101.34.87.172:8888"

    defaultConfig {
        applicationId "com.flipbook.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 140
        versionName "1.0.140"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrlProp}\""
    }

    signingConfigs {
        phoneRelease {
            if (phoneSigningFile.exists()) {
                storeFile rootProject.file(phoneSigning.getProperty('storeFile'))
                storePassword phoneSigning.getProperty('storePassword')
                keyAlias phoneSigning.getProperty('keyAlias')
                keyPassword phoneSigning.getProperty('keyPassword')
            }
        }
    }

    flavorDimensions "device"
    productFlavors {
        tablet {
            dimension "device"
            buildConfigField "boolean", "PHONE_UI", "false"
        }
        phone {
            dimension "device"
            applicationIdSuffix ".phone"
            versionCode 148
            versionName "1.0.148"
            versionNameSuffix "-phone"
            if (phoneSigningFile.exists()) signingConfig signingConfigs.phoneRelease
            buildConfigField "boolean", "PHONE_UI", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation project(':shared')
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidxLifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$androidxLifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$androidxLifecycleVersion"
    implementation "androidx.navigation:navigation-compose:$androidxNavigationVersion"

    implementation "androidx.compose.ui:ui:$composeUiVersion"
    implementation "androidx.compose.ui:ui-tooling-preview:$composeUiVersion"
    implementation "androidx.compose.material3:material3:$composeMaterial3Version"
    // 图标由 shared 的 CMP 依赖导出，版本独立于 Compose UI。
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.material:material:$materialVersion"
    debugImplementation "androidx.compose.ui:ui-tooling:$composeUiVersion"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "androidx.datastore:datastore-preferences:$datastoreVersion"
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"
    implementation "io.coil-kt:coil-compose:$coilVersion"
    implementation "com.google.code.gson:gson:$gsonVersion"
    implementation "com.google.zxing:core:3.5.3"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}


// 本地构建同一套阅读界面到 APK；不上传、不发布。
def knowledgeAssets = layout.buildDirectory.dir("generated/knowledge-assets")
tasks.register("buildKnowledgeReader", Exec) {
    workingDir rootProject.file("../web")
    commandLine "pnpm", "build"
    inputs.dir(rootProject.file("../web/src"))
    inputs.dir(rootProject.file("../web/public"))
    inputs.file(rootProject.file("../web/vite.config.js"))
    inputs.file(rootProject.file("../web/offline-plugin.js"))
    outputs.dir(rootProject.file("../web/dist"))
}
tasks.register("copyKnowledgeReader", Copy) {
    dependsOn "buildKnowledgeReader"
    from rootProject.file("../web/dist")
    into knowledgeAssets.map { it.dir("knowledge-reader") }
}
android.sourceSets.main.assets.srcDir(knowledgeAssets)
tasks.named("preBuild").configure { dependsOn "copyKnowledgeReader" }
