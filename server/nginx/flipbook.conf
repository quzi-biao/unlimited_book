upstream flipbook_backend {
    server 10.138.10.122:8888;
    keepalive 32;
}

# 主应用（HTTPS 8888）
server {
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types          application/json text/plain text/html text/css application/javascript text/javascript application/x-javascript;
    listen 8888 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/flipbook.crt;
    ssl_certificate_key /etc/nginx/ssl/flipbook.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 60m;
    access_log /var/log/nginx/flipbook_access.log;
    error_log /var/log/nginx/flipbook_error.log warn;

    # OSS 图片走本机代理
    location /oss-img/ {
        rewrite ^/oss-img/(.*)$ /$1 break;
        proxy_pass https://bounter-go.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Host bounter-go.oss-cn-hangzhou.aliyuncs.com;
        proxy_ssl_server_name on;
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
        add_header Content-Disposition "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # AI 生图接口：超时单独放大到 700s（gpt-image-2 最慢需要 600s）
    location /api/ai/ {
        proxy_pass         http://flipbook_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_connect_timeout  10s;
        proxy_send_timeout    700s;
        proxy_read_timeout    700s;
    }

    location / {
        proxy_pass         http://flipbook_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
