# 本地完整环境：docker compose -f docker-compose.local.yml up -d --build
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flipbook
      POSTGRES_USER: flipbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipbook -d flipbook"]
      interval: 5s
      timeout: 5s
      retries: 12

  flipbook:
    build:
      context: .
      dockerfile: Dockerfile
    image: flipbook:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8888
      DATABASE_URL: postgresql://flipbook:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/flipbook
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      LOCAL_ASSET_DIR: /app/local-media
      LOCAL_UPLOAD_DIR: /app/local-uploads
      # 新话题点击后由 AI 生成；保留图片档案，暂不读取共享预生成图片。
      SHARED_TOPIC_IMAGES_ENABLED: 'false'
    volumes:
      - ./.local-data/media:/app/local-media:ro
      - ./.local-data/uploads:/app/local-uploads
    ports:
      - "127.0.0.1:${FLIPBOOK_PORT:-8888}:8888"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8888/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    profiles: [web]
    build:
      context: ./web
      dockerfile: Dockerfile
    image: flipbook-web:local
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://flipbook:8888
      VITE_LOCAL_SHARED_READER: 'true'
    ports:
      - "127.0.0.1:5175:5175"
    depends_on:
      flipbook:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5175/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres-data:
